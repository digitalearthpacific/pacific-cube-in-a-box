---
name: dep_s2s1_mrd
description: Mineral Resource Detection Land Cover
metadata_type: eo3

license: CC-BY-4.0

metadata:
  product:
    name: dep_s2s1_mrd

storage:
  crs: EPSG:3832
  resolution:
    x: 10
    y: -10

measurements:
  - name: class
    aliases: ["classification"]
    units: "1"
    dtype: uint8
    nodata: 255
    flags_definition:
      class:
        bits: [0, 1, 2, 3, 4, 5, 6, 7]
        description: Class
        values:
          1: bare land
          2: forest
          3: crops
          4: grassland
          5: settlements
          6: mangroves
          7: water
          8: quarry
          255: nodata

  - name: proba
    aliases: ["probability"]
    units: "1"
    dtype: uint8
    nodata: 255
